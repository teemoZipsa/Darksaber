services:
  - type: web
    name: darksaber-world-server
    runtime: node
    buildCommand: npm ci --include=dev && npm run build:server && npm prune --omit=dev
    startCommand: npm run server:prod
    healthCheckPath: /healthz
    autoDeployTrigger: 'checksPass'
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_REFRESH_TOKEN_HASH_SECRET
        generateValue: true
      - key: AUTH_JWT_ISSUER
        value: darksaber-world
      - key: AUTH_JWT_AUDIENCE
        value: darksaber-client
      - key: AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: AUTH_REFRESH_COOKIE_SAMESITE
        value: None
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_ALLOW_MISSING_ORIGIN
        value: "0"
      - key: WORLD_SHARD_COUNT
        value: "1"
