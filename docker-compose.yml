services:
  postgres:
    image: postgres:16-alpine
    container_name: darksaber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: darksaber
      POSTGRES_USER: darksaber
      POSTGRES_PASSWORD: darksaber_dev_password
    ports:
      - "5432:5432"
    volumes:
      - darksaber-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darksaber -d darksaber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  darksaber-postgres-data:
